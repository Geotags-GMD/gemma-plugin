name: Promote Dev to Main

on:
  workflow_dispatch:
    inputs:
      trigger_stable_release:
        description: 'Trigger stable release after promotion?'
        required: false
        default: false
        type: boolean
      bump_type:
        description: 'SemVer bump (only used if trigger_stable_release is true)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

concurrency:
  group: promote-to-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  promote:
    name: Promote dev → main
    runs-on: ubuntu-latest

    steps:
      # ── 1. Generate Gemma Bot Token ──────────────────────────────────
      - name: Generate Gemma Bot Token
        id: generate-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # ── 2. Checkout with full history ────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token || secrets.AI_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── 3. Configure Git identity ───────────────────────────────────
      - name: Configure Git
        run: |
          git config user.name "Gemma Release[bot]"
          git config user.email "gemma-release[bot]@users.noreply.github.com"

      # ── 4. Verify dev is ahead of main ──────────────────────────────
      - name: Verify promotion eligibility
        id: verify
        run: |
          git fetch origin main dev

          AHEAD=$(git rev-list --count origin/main..origin/dev)
          BEHIND=$(git rev-list --count origin/dev..origin/main)

          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"

          echo "📊 dev is $AHEAD commit(s) ahead and $BEHIND commit(s) behind main"

          if [ "$AHEAD" -eq 0 ]; then
            echo "::error::Nothing to promote — dev has no new commits ahead of main."
            exit 1
          fi

          if [ "$BEHIND" -gt 0 ]; then
            echo "::warning::dev is $BEHIND commit(s) behind main. A merge commit will be created."
          fi

      # ── 5. Merge dev into main ──────────────────────────────────────
      - name: Merge dev into main
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.AI_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git checkout main
          git pull origin main

          # Attempt fast-forward first; fall back to merge commit
          if git merge --ff-only origin/dev 2>/dev/null; then
            echo "✅ Fast-forward merge successful"
          else
            echo "⚠️ Fast-forward not possible, creating merge commit"
            git merge --no-edit origin/dev -m "chore: promote dev to main"
          fi

          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git main

      # ── 6. Summary ─────────────────────────────────────────────────
      - name: Promotion summary
        run: |
          echo "## ✅ Promotion Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Detail | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commits promoted** | ${{ steps.verify.outputs.ahead }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Trigger stable release** | ${{ inputs.trigger_stable_release }} |" >> "$GITHUB_STEP_SUMMARY"

      # ── 7. Optionally trigger stable release ────────────────────────
      - name: Trigger stable release
        if: inputs.trigger_stable_release == true && success()
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.AI_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Triggering Release Gemma Plugin (Stable) workflow on main..."
          gh workflow run release-stable.yml \
            --ref main \
            -f bump_type="${{ inputs.bump_type }}" \
            -f custom_version=""
          echo "✅ Successfully triggered Release Gemma Plugin (Stable) workflow"

