  <circle cx="12" cy="12" r="9" stroke="#0288D1" stroke-width="1.8" fill="#0288D1" fill-opacity="0.12"/>
  <!-- Latitude Equator Line -->
  <line x1="3" y1="12" x2="21" y2="12" stroke="#00897B" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Latitude Parallels -->
  <path d="M4.5 7.5 C8 9.5 16 9.5 19.5 7.5" stroke="#00897B" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M4.5 16.5 C8 14.5 16 14.5 19.5 16.5" stroke="#00897B" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Central Meridian Ellipse -->
  <ellipse cx="12" cy="12" rx="4.5" ry="9" stroke="#00897B" stroke-width="1.4"/>
  <!-- Projection Finder Target Reticle -->
  <circle cx="12" cy="12" r="3.6" stroke="#F57C00" stroke-width="1.8" fill="#FFE0B2" fill-opacity="0.35"/>
  <circle cx="12" cy="12" r="1.1" fill="#E65100"/>
