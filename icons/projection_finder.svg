  <line x1="12" y1="15.6" x2="12" y2="18" stroke="#F57C00" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="6" y1="12" x2="8.4" y2="12" stroke="#F57C00" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="15.6" y1="12" x2="18" y2="12" stroke="#F57C00" stroke-width="1.8" stroke-linecap="round"/>
</svg>
